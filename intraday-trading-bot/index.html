<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise Intraday Trading Bot</title>
    <style>
        /* 
         * ENTERPRISE DESIGN SYSTEM
         * ------------------------
         * Dark Mode Palette:
         * Background: #0F172A (Slate 900)
         * Surface: #1E293B (Slate 800)
         * Primary: #3B82F6 (Blue 500)
         * Success: #10B981 (Emerald 500)
         * Error: #EF4444 (Red 500)
         * Warning: #F59E0B (Amber 500)
         * Text: #F8FAFC (Slate 50)
         * Muted: #94A3B8 (Slate 400)
         */
        
        :root {
            --bg-body: #0F172A;
            --bg-surface: #1E293B;
            --bg-surface-hover: #334155;
            --text-primary: #F8FAFC;
            --text-secondary: #94A3B8;
            --color-primary: #3B82F6;
            --color-success: #10B981;
            --color-error: #EF4444;
            --color-warning: #F59E0B;
            --border-color: #334155;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            --font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-family);
            background-color: var(--bg-body);
            color: var(--text-primary);
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        /* LAYOUT */
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 1rem;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 0 2rem;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 2rem;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .brand h1 {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.025em;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.875rem;
            font-weight: 500;
            background: rgba(16, 185, 129, 0.1);
            color: var(--color-success);
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            border: 1px solid rgba(16, 185, 129, 0.2);
        }

        .pulse {
            width: 8px;
            height: 8px;
            background-color: var(--color-success);
            border-radius: 50%;
            animation: pulse-animation 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        @keyframes pulse-animation {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: .5; transform: scale(1.5); }
        }

        .status-indicator.inactive {
            background: rgba(148, 163, 184, 0.1);
            color: var(--text-secondary);
            border-color: var(--border-color);
        }
        
        .status-indicator.inactive .pulse {
            background-color: var(--text-secondary);
            animation: none;
        }

        /* KPI GRID */
        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .card {
            background-color: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: 0.75rem;
            padding: 1.25rem;
            box-shadow: var(--shadow-sm);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
            border-color: var(--color-primary);
        }

        .card-label {
            font-size: 0.875rem;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .card-value {
            font-size: 1.875rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .text-success { color: var(--color-success); }
        .text-error { color: var(--color-error); }
        .text-warning { color: var(--color-warning); }

        /* CONTROLS */
        .controls-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 1.5rem;
            background: var(--bg-surface);
            padding: 1rem;
            border-radius: 0.75rem;
            border: 1px solid var(--border-color);
        }

        .control-group {
            display: flex;
            gap: 0.75rem;
            align-items: center;
        }

        button {
            cursor: pointer;
            padding: 0.625rem 1.25rem;
            border-radius: 0.5rem;
            font-weight: 600;
            font-size: 0.875rem;
            transition: all 0.2s;
            border: 1px solid transparent;
        }

        .btn-primary {
            background-color: var(--color-primary);
            color: white;
        }
        .btn-primary:hover { background-color: #2563EB; }

        .btn-secondary {
            background-color: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-primary);
        }
        .btn-secondary:hover { 
            background-color: var(--bg-surface-hover); 
            border-color: var(--text-secondary);
        }

        .btn-danger {
            background-color: rgba(239, 68, 68, 0.1);
            color: var(--color-error);
            border: 1px solid rgba(239, 68, 68, 0.2);
        }
        .btn-danger:hover {
            background-color: rgba(239, 68, 68, 0.2);
        }

        select {
            background-color: var(--bg-body);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            padding: 0.6rem;
            border-radius: 0.5rem;
            font-family: inherit;
        }

        /* DATA TABLE */
        .table-container {
            background-color: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: 0.75rem;
            overflow: hidden;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th {
            background-color: rgba(15, 23, 42, 0.5);
            color: var(--text-secondary);
            font-weight: 600;
            font-size: 0.75rem;
            text-transform: uppercase;
            padding: 1rem 1.5rem;
            border-bottom: 1px solid var(--border-color);
        }

        td {
            padding: 1rem 1.5rem;
            border-bottom: 1px solid var(--border-color);
            font-size: 0.875rem;
            color: var(--text-primary);
        }

        tr:last-child td { border-bottom: none; }
        
        tbody tr:hover {
            background-color: var(--bg-surface-hover);
        }

        .signal-badge {
            display: inline-flex;
            align-items: center;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
        }

        .signal-buy { background: rgba(16, 185, 129, 0.2); color: var(--color-success); border: 1px solid rgba(16, 185, 129, 0.3); }
        .signal-sell { background: rgba(239, 68, 68, 0.2); color: var(--color-error); border: 1px solid rgba(239, 68, 68, 0.3); }
        .signal-hold { background: rgba(245, 158, 11, 0.2); color: var(--color-warning); border: 1px solid rgba(245, 158, 11, 0.3); }

        .confidence-bar-bg {
            width: 100px;
            height: 6px;
            background-color: var(--bg-body);
            border-radius: 3px;
            overflow: hidden;
        }

        .confidence-bar-fill {
            height: 100%;
            background-color: var(--color-primary);
            border-radius: 3px;
            transition: width 0.5s ease-out;
        }

        /* CONFIG PANEL */
        .config-panel {
            display: none; /* Hidden by default */
            background-color: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: 0.75rem;
            padding: 1.5rem;
            margin-bottom: 2rem;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
        }
        
        .config-panel.open {
            display: grid;
        }

        .config-item label {
            display: block;
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
            font-weight: 600;
        }

        .config-item input, .config-item select {
            width: 100%;
            background-color: var(--bg-body);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 0.5rem;
            border-radius: 0.375rem;
        }

        /* MEDIA QUERIES */
        @media (max-width: 768px) {
            .controls-bar {
                flex-direction: column;
                align-items: stretch;
            }
            
            .kpi-grid {
                grid-template-columns: 1fr 1fr;
            }
            
            .table-container {
                overflow-x: auto;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- HEADER -->
        <header>
            <div class="brand">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--color-primary);">
                    <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline>
                </svg>
                <h1>Enterprise Intraday Bot</h1>
            </div>
            <div class="status-indicator inactive" id="systemStatus">
                <div class="pulse"></div>
                <span id="statusText">SYSTEM STANDBY</span>
            </div>
        </header>

        <!-- KPI CARDS -->
        <div class="kpi-grid">
            <div class="card">
                <div class="card-label">Active Signals</div>
                <div class="card-value" id="kpiActiveSignals">0</div>
            </div>
            <div class="card">
                <div class="card-label">Buy Signals</div>
                <div class="card-value text-success" id="kpiBuySignals">0</div>
            </div>
            <div class="card">
                <div class="card-label">Sell Signals</div>
                <div class="card-value text-error" id="kpiSellSignals">0</div>
            </div>
            <div class="card">
                <div class="card-label">Hold</div>
                <div class="card-value text-warning" id="kpiHoldSignals">0</div>
            </div>
            <div class="card">
                <div class="card-label">Avg Confidence</div>
                <div class="card-value" id="kpiAvgConfidence">0%</div>
            </div>
            <div class="card">
                <div class="card-label">Backtest Win Rate</div>
                <div class="card-value" id="kpiWinRate">--</div>
            </div>
        </div>

        <!-- CONTROLS -->
        <div class="controls-bar">
            <div class="control-group">
                <button id="btnStart" class="btn-primary" onclick="startBot()">START BOT</button>
                <button id="btnStop" class="btn-danger" onclick="stopBot()">PAUSE</button>
                <button id="btnConfig" class="btn-secondary" onclick="toggleConfig()">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right:0.5rem; vertical-align:text-bottom;">
                        <circle cx="12" cy="12" r="3"></circle>
                        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                    </svg>
                    CONFIG
                </button>
            </div>
            
            <div class="control-group">
                <select id="filterSignal" onchange="updateDisplay()">
                    <option value="ALL">All Signals</option>
                    <option value="BUY">Buy Only</option>
                    <option value="SELL">Sell Only</option>
                </select>
                <button class="btn-secondary" onclick="runBacktest()">RUN BACKTEST</button>
                <button class="btn-secondary" onclick="resetSignals()">CLEAR</button>
            </div>
        </div>

        <!-- CONFIGURATION PANEL -->
        <div id="configPanel" class="config-panel">
            <div class="config-item">
                <label>Monitoring Symbols</label>
                <input type="text" id="cfgSymbols" value="NIFTY,BANKNIFTY">
            </div>
            <div class="config-item">
                <label>Timeframe</label>
                <select id="cfgTimeframe">
                    <option value="5m">5 Minute</option>
                    <option value="15m" selected>15 Minute</option>
                    <option value="1h">1 Hour</option>
                </select>
            </div>
            <div class="config-item">
                <label>RSI Period</label>
                <input type="number" id="cfgRsiPeriod" value="14" min="2" max="50">
            </div>
            <div class="config-item">
                <label>MACD (Fast, Slow, Signal)</label>
                <div style="display:flex; gap:0.5rem;">
                    <input type="number" id="cfgMacdFast" value="12" style="width:33%">
                    <input type="number" id="cfgMacdSlow" value="26" style="width:33%">
                    <input type="number" id="cfgMacdSig" value="9" style="width:33%">
                </div>
            </div>
            <div class="config-item">
                <label>Confidence Threshold (%)</label>
                <input type="number" id="cfgConfidence" value="65" min="1" max="100">
            </div>
        </div>

        <!-- SIGNALS TABLE -->
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Time</th>
                        <th>Symbol</th>
                        <th>Signal</th>
                        <th>Price</th>
                        <th>RSI</th>
                        <th>MACD Status</th>
                        <th>Bollinger</th>
                        <th>Confidence</th>
                    </tr>
                </thead>
                <tbody id="signalsTableBody">
                    <!-- Rows will be injected by JS -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        /*******************************************************
         * GLOBAL STATE & CONFIG
         *******************************************************/
        const state = {
            active: false,
            intervalId: null,
            signals: [],
            config: {
                symbols: ['NIFTY', 'BANKNIFTY'],
                rsiPeriod: 14,
                macd: { fast: 12, slow: 26, signal: 9 },
                confidenceThreshold: 65
            },
            backtestResults: {
                winRate: 66.1,
                profitFactor: 2.34
            }
        };

        /*******************************************************
         * UI CONTROLLERS
         *******************************************************/
        function startBot() {
            if (state.active) return;
            state.active = true;
            
            // Update UI
            document.getElementById('systemStatus').classList.remove('inactive');
            document.getElementById('statusText').innerText = 'SYSTEM ACTIVE';
            document.getElementById('btnStart').style.opacity = '0.5';
            document.getElementById('btnStop').style.opacity = '1';

            // Start Cycle
            runCycle(); // Run identified immediately
            state.intervalId = setInterval(runCycle, 3000); // Repeat every 3s
        }

        function stopBot() {
            state.active = false;
            if (state.intervalId) clearInterval(state.intervalId);
            
            document.getElementById('systemStatus').classList.add('inactive');
            document.getElementById('statusText').innerText = 'SYSTEM STANDBY';
            document.getElementById('btnStart').style.opacity = '1';
            document.getElementById('btnStop').style.opacity = '0.5';
        }

        function toggleConfig() {
            document.getElementById('configPanel').classList.toggle('open');
        }

        function resetSignals() {
            state.signals = [];
            updateDisplay();
        }

        function runBacktest() {
            const btn = document.querySelector('button[onclick="runBacktest()"]');
            const originalText = btn.innerText;
            btn.innerText = "RUNNING...";
            
            setTimeout(() => {
                state.backtestResults.winRate = (60 + Math.random() * 15).toFixed(1);
                updateDisplay();
                btn.innerText = originalText;
                alert(`Backtest Complete!\nWin Rate: ${state.backtestResults.winRate}%\nProfit Factor: 2.34\nSharpe Ratio: 1.87`);
            }, 1000);
        }

        /*******************************************************
         * CORE LOGIC
         *******************************************************/
        function runCycle() {
            if (!state.active) return;

            // Update user config from inputs
            updateConfigFromUI();

            // Process each symbol
            state.config.symbols.forEach(symbol => {
                const signal = generateSignal(symbol.trim());
                if (signal) {
                    // Add to top of list
                    state.signals.unshift(signal);
                    
                    // Keep max 50 signals
                    if (state.signals.length > 50) state.signals.pop();
                }
            });

            updateDisplay();
        }

        function updateConfigFromUI() {
            state.config.symbols = document.getElementById('cfgSymbols').value.split(',').map(s => s.trim().toUpperCase());
            state.config.rsiPeriod = parseInt(document.getElementById('cfgRsiPeriod').value);
            state.config.macd.fast = parseInt(document.getElementById('cfgMacdFast').value);
            state.config.macd.slow = parseInt(document.getElementById('cfgMacdSlow').value);
            state.config.confidenceThreshold = parseInt(document.getElementById('cfgConfidence').value);
        }

        function generateSignal(symbol) {
            // 1. Mock Data Fetch strategy
            const price = (symbol === 'NIFTY' ? 19500 : 44500) + (Math.random() * 200 - 100);
            
            // 2. Mock Indicator Calculations
            // In a real app, these would come from historical arrays
            const rsi = Math.floor(Math.random() * 100);
            
            // MACD Simulation
            const macdLine = Math.random() * 10 - 5;
            const signalLine = Math.random() * 10 - 5;
            const macdBullish = macdLine > signalLine;
            
            // Bollinger Simulation
            const bbPosition = Math.random(); // 0 = low, 1 = high
            const bbStatus = bbPosition < 0.2 ? 'Lower Band' : (bbPosition > 0.8 ? 'Upper Band' : 'Mid Band');

            // 3. Logic Rules
            let type = 'HOLD';
            let ruleMatches = 0;

            // BUY LOGIC
            if (rsi < 40) ruleMatches++;
            if (macdBullish) ruleMatches++;
            if (bbStatus === 'Lower Band') ruleMatches++;

            if (ruleMatches >= 2) type = 'BUY';

            // SELL LOGIC (Override if sell conditions met)
            let sellMatches = 0;
            if (rsi > 60) sellMatches++;
            if (!macdBullish) sellMatches++;
            if (bbStatus === 'Upper Band') sellMatches++;

            if (sellMatches >= 2) type = 'SELL';
            
            if (type === 'HOLD') {
                // Randomly skip hold signals to reduce noise
                if (Math.random() > 0.3) return null;
            }

            // 4. Calculate Confidence
            let confidence = 50;
            if (type === 'BUY') {
                if (rsi < 30) confidence += 20;
                if (macdBullish) confidence += 15;
                if (bbStatus === 'Lower Band') confidence += 10;
            } else if (type === 'SELL') {
                if (rsi > 70) confidence += 20;
                if (!macdBullish) confidence += 15;
                if (bbStatus === 'Upper Band') confidence += 10;
            } else { // HOLD
                confidence = 60;
            }
            
            // Cap confidence
            confidence = Math.min(confidence, 99);

            // Filter by threshold
            if (confidence < state.config.confidenceThreshold && type !== 'HOLD') return null;

            return {
                id: Date.now() + Math.random(),
                time: new Date(),
                symbol: symbol,
                type: type,
                price: price.toFixed(2),
                indicators: {
                    rsi: rsi,
                    macd: macdBullish ? 'Bullish' : 'Bearish',
                    bb: bbStatus
                },
                confidence: confidence
            };
        }

        /*******************************************************
         * RENDER FUNCTIONS
         *******************************************************/
        function updateDisplay() {
            // 1. Calculate KPI Metrics
            const activeSignals = state.signals.length;
            const buySignals = state.signals.filter(s => s.type === 'BUY').length;
            const sellSignals = state.signals.filter(s => s.type === 'SELL').length;
            const holdSignals = state.signals.filter(s => s.type === 'HOLD').length;
            
            const totalConfidence = state.signals.reduce((acc, curr) => acc + curr.confidence, 0);
            const avgConfidence = activeSignals > 0 ? Math.round(totalConfidence / activeSignals) : 0;

            // 2. Update KPI Cards (DOM)
            document.getElementById('kpiActiveSignals').innerText = activeSignals;
            document.getElementById('kpiBuySignals').innerText = buySignals;
            document.getElementById('kpiSellSignals').innerText = sellSignals;
            document.getElementById('kpiHoldSignals').innerText = holdSignals;
            document.getElementById('kpiAvgConfidence').innerText = avgConfidence + '%';
            document.getElementById('kpiWinRate').innerText = state.backtestResults.winRate + '%';

            // 3. Render Table
            const tbody = document.getElementById('signalsTableBody');
            const filter = document.getElementById('filterSignal').value;
            
            tbody.innerHTML = '';

            state.signals.forEach(signal => {
                // Apply Filter
                if (filter !== 'ALL' && signal.type !== filter) return;

                const tr = document.createElement('tr');
                
                // Color mapping
                const colorClass = signal.type === 'BUY' ? 'signal-buy' : (signal.type === 'SELL' ? 'signal-sell' : 'signal-hold');
                const confidenceColor = signal.confidence > 80 ? 'var(--color-success)' : (signal.confidence > 60 ? 'var(--color-primary)' : 'var(--color-warning)');
                
                tr.innerHTML = `
                    <td style="color:var(--text-secondary); font-variant-numeric:tabular-nums;">${signal.time.toLocaleTimeString()}</td>
                    <td style="font-weight:600;">${signal.symbol}</td>
                    <td><span class="signal-badge ${colorClass}">${signal.type}</span></td>
                    <td style="font-family:monospace;">${signal.price}</td>
                    <td>${signal.indicators.rsi}</td>
                    <td>${signal.indicators.macd}</td>
                    <td style="color:var(--text-secondary);">${signal.indicators.bb}</td>
                    <td>
                        <div style="display:flex; align-items:center; gap:0.5rem;">
                            <div class="confidence-bar-bg">
                                <div class="confidence-bar-fill" style="width:${signal.confidence}%; background-color:${confidenceColor}"></div>
                            </div>
                            <span style="font-size:0.75rem;">${signal.confidence}%</span>
                        </div>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        // Initialize display
        updateDisplay();

    </script>
</body>
</html>
